name: CI

on:
  push:
  pull_request:

jobs:
  # Lint/test each service. A failure here fails the pipeline and blocks images.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [passes, analytics]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r services/${{ matrix.service }}/requirements.txt
      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: python -m pytest -q

  # Build every service image on every push/PR; publish to GHCR only from main.
  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [passes, analytics]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # GHCR image names must be lowercase; a capital in the owner would fail the push.
      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Log in to GHCR (main only)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ env.OWNER }}/lineskip-${{ matrix.service }}:${{ github.sha }}
