[pytest]
# Coverage is measured over the business-logic packages the tests target.
# Glue (app.py, db.py, config.py, analytics_client.py) is exercised by the
# local docker run and the cross-seam integration check, not these unit tests.
addopts = --cov=passes --cov=auth --cov-report=term-missing --cov-fail-under=70
