<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login &middot; LineSkip</title><link rel="stylesheet" href="style.css"></head><body>
<nav class="nav"><a class="brand" href="index.html">LineSkip</a><div class="nav-links"><a href="index.html">Venues</a><a href="dashboard.html">Dashboard</a><a href="my-passes.html" data-auth-only>My Passes</a><a href="login.html" data-guest-only>Login</a><a href="#" id="logout-link" data-auth-only>Logout</a></div></nav>
<main class="container">
  <h1>Login or register</h1>
  <form id="auth-form" class="form">
    <label>Email <input type="email" id="email" required></label>
    <label>Password <input type="password" id="password" minlength="8" required></label>
    <div class="form-actions">
      <button type="submit">Login</button>
      <button type="button" id="register-btn">Register</button>
    </div>
  </form>
  <p id="auth-msg" class="msg"></p>
</main>
<script src="config.js"></script><script src="app.js"></script>
<script>
  const msg = document.getElementById("auth-msg");
  const creds = () => ({ email: document.getElementById("email").value, password: document.getElementById("password").value });

  async function login() {
    const res = await authFetch(PASSES + "/auth/login", { method: "POST", body: JSON.stringify(creds()) });
    const data = await res.json();
    if (res.ok) { Auth.set(data.token); location.href = "index.html"; }
    else { msg.className = "msg err"; msg.textContent = data.error || "Login failed."; }
  }

  document.getElementById("auth-form").addEventListener("submit", (e) => { e.preventDefault(); login(); });
  document.getElementById("register-btn").addEventListener("click", async () => {
    const res = await authFetch(PASSES + "/auth/register", { method: "POST", body: JSON.stringify(creds()) });
    const data = await res.json();
    if (res.ok) { login(); } else { msg.className = "msg err"; msg.textContent = data.error || "Registration failed."; }
  });
</script></body></html>
