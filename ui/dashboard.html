<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revenue &middot; LineSkip</title><link rel="stylesheet" href="style.css"></head><body>
<nav class="nav"><a class="brand" href="index.html">LineSkip</a><div class="nav-links"><a href="index.html">Venues</a><a href="dashboard.html">Dashboard</a><a href="my-passes.html" data-auth-only>My Passes</a><a href="login.html" data-guest-only>Login</a><a href="#" id="logout-link" data-auth-only>Logout</a></div></nav>
<main class="container">
  <h1>Revenue dashboard</h1>
  <p class="muted">Served by the Analytics service, called directly from the browser (the UI talks to both services).</p>
  <section><h2>Total revenue</h2><p class="big" id="total">&mdash;</p></section>
  <section><h2>Revenue per venue</h2><table id="by-venue"><thead><tr><th>Venue</th><th>Revenue</th></tr></thead><tbody></tbody></table></section>
  <section><h2>Top venues</h2><table id="top"><thead><tr><th>Venue</th><th>Revenue</th></tr></thead><tbody></tbody></table></section>
  <section><h2>Revenue per day</h2><table id="by-day"><thead><tr><th>Day</th><th>Revenue</th></tr></thead><tbody></tbody></table></section>
</main>
<script src="config.js"></script><script src="app.js"></script>
<script>
  function fillTable(id, rows, keyCol) {
    const tbody = document.querySelector("#" + id + " tbody"); tbody.innerHTML = "";
    if (!rows.length) { tbody.innerHTML = "<tr><td colspan='2' class='muted'>No data yet.</td></tr>"; return; }
    rows.forEach((r) => {
      const tr = document.createElement("tr");
      tr.innerHTML = "<td>" + r[keyCol] + "</td><td>" + euros(r.revenue_cents) + "</td>"; tbody.appendChild(tr);
    });
  }
  const getJson = (url) => fetch(url).then((r) => r.json());
  (async () => {
    try {
      const total = await getJson(ANALYTICS + "/analytics/revenue");
      document.getElementById("total").textContent = euros(total.total_revenue_cents);
      fillTable("by-venue", await getJson(ANALYTICS + "/analytics/revenue/by-venue"), "venue_id");
      fillTable("top", await getJson(ANALYTICS + "/analytics/venues/top"), "venue_id");
      fillTable("by-day", await getJson(ANALYTICS + "/analytics/revenue/by-day"), "day");
    } catch (e) { document.getElementById("total").textContent = "analytics unavailable"; }
  })();
</script></body></html>
