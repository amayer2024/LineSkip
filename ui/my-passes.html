<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Passes &middot; LineSkip</title><link rel="stylesheet" href="style.css"></head><body>
<nav class="nav"><a class="brand" href="index.html">LineSkip</a><div class="nav-links"><a href="index.html">Venues</a><a href="dashboard.html">Dashboard</a><a href="my-passes.html" data-auth-only>My Passes</a><a href="login.html" data-guest-only>Login</a><a href="#" id="logout-link" data-auth-only>Logout</a></div></nav>
<main class="container">
  <h1>My passes</h1>
  <p id="passes-msg" class="msg"></p>
  <div id="passes" class="cards"></div>
</main>
<script src="config.js"></script><script src="app.js"></script>
<script>
  const container = document.getElementById("passes");
  const msg = document.getElementById("passes-msg");

  async function refund(id) {
    const res = await authFetch(PASSES + "/passes/" + id + "/refund", { method: "POST" });
    const data = await res.json();
    if (res.ok) { load(); } else { msg.className = "msg err"; msg.textContent = data.error || "Refund failed."; }
  }

  async function load() {
    if (!Auth.get()) { location.href = "login.html"; return; }
    const res = await authFetch(PASSES + "/passes/mine");
    if (!res.ok) { msg.className = "msg err"; msg.textContent = "Could not load passes."; return; }
    const passes = await res.json();
    container.innerHTML = "";
    if (!passes.length) { container.innerHTML = "<p>You have no passes yet.</p>"; return; }
    passes.forEach((p) => {
      const card = document.createElement("div"); card.className = "card";
      card.innerHTML =
        "<h3>Pass #" + p.id + "</h3>" +
        "<p class='muted'>Status: " + p.status + "</p>" +
        "<p>Code: <code>" + p.redemption_code + "</code></p>" +
        "<p class='price'>" + euros(p.price_cents_paid) + "</p>";
      if (p.status === "active") {
        const btn = document.createElement("button"); btn.textContent = "Refund";
        btn.addEventListener("click", () => refund(p.id)); card.appendChild(btn);
      }
      container.appendChild(card);
    });
  }
  load();
</script></body></html>
